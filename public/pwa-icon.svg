<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados padrão app móvel -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="4" />
  
  <!-- Brilho Dourado de Fundo -->
  <circle cx="256" cy="230" r="180" fill="url(#ambientGlow)" />

  <!-- Símbolo do Leão Dourado Heráldico do Contaju -->
  <g transform="translate(256, 230) scale(14) translate(-12, -12)" filter="url(#goldGlow)">
    <!-- Coroa Real -->
    <path 
      d="M8 4L10 6.5L12 3L14 6.5L16 4V7H8V4Z" 
      fill="url(#goldGradient)" 
      stroke="#fef08a" 
      stroke-width="0.3"
    />
    <!-- Juba e Cabeça do Leão -->
    <path 
      d="M12 7C9 7 7.5 9 7.5 11.5C7.5 13.5 8.5 15.2 9.8 16.2C10.2 16.5 10.5 17.2 10.5 17.8L10.3 20H13.7L13.5 17.8C13.5 17.2 13.8 16.5 14.2 16.2C15.5 15.2 16.5 13.5 16.5 11.5C16.5 9 15 7 12 7Z" 
      fill="url(#goldGradient)" 
    />
    <!-- Traços do Rosto -->
    <path 
      d="M12 11.5V13.8M10.8 12.8L12 13.8L13.2 12.8" 
      stroke="#0b0f19" 
      stroke-width="0.8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Olhos -->
    <circle cx="10.2" cy="10.8" r="0.6" fill="#0b0f19" />
    <circle cx="13.8" cy="10.8" r="0.6" fill="#0b0f19" />
  </g>

  <!-- Tipografia Oficial Contaju -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">
    CONTAJU
  </text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#f59e0b" text-anchor="middle">
    GESTÃO FINANCEIRA
  </text>
</svg>
